<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Lost in the Cosmos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0e17;
            --card-bg: rgba(23, 32, 54, 0.65);
            --card-border: rgba(99, 102, 241, 0.25);
            --accent-primary: #6366f1;
            --accent-secondary: #06b6d4;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, var(--bg-dark) 80%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            overflow: hidden;
            position: relative;
            padding: 1.5rem;
        }

        /* Starry background effect */
        .stars-container {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(1px 1px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 140px 70px, #a5b4fc, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 220px 180px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 300px 250px, #67e8f9, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 450px 100px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 600px 320px, #c084fc, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 750px 160px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 850px 420px, #38bdf8, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 980px 210px, #ffffff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 1000px 500px;
            opacity: 0.7;
            animation: drift 60s linear infinite;
        }

        @keyframes drift {
            from { transform: translateY(0); }
            to { transform: translateY(-500px); }
        }

        .container {
            position: relative;
            z-index: 10;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 28px;
            padding: 3.5rem 2.5rem;
            max-width: 580px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 40px rgba(99, 102, 241, 0.15);
        }

        .glitch-num {
            font-size: 7.5rem;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -3px;
            background: linear-gradient(135deg, #a5b4fc 0%, #38bdf8 50%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            animation: pulseGlow 4s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { filter: drop-shadow(0 0 15px rgba(99, 102, 241, 0.4)); }
            100% { filter: drop-shadow(0 0 30px rgba(56, 189, 248, 0.7)); }
        }

        .french-phrase {
            font-size: 1.5rem;
            font-weight: 600;
            color: #e0e7ff;
            margin-bottom: 1.25rem;
            letter-spacing: -0.5px;
        }

        .explanation {
            font-size: 1rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 2rem;
            padding: 0 1rem;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, var(--accent-primary) 0%, #4f46e5 100%);
            color: white;
            padding: 0.9rem 2rem;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
        }

        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(99, 102, 241, 0.6);
            background: linear-gradient(135deg, #818cf8 0%, #6366f1 100%);
        }

        .badge {
            display: inline-block;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #c7d2fe;
            padding: 0.3rem 0.85rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="stars-container"></div>
    <div class="container">
        <span class="badge">Error 404</span>
        <div class="glitch-num">404</div>
        <h1 class="french-phrase">Ceci n'est pas une page</h1>
        <p class="explanation">
            The coordinates you were navigating toward do not exist in our galaxy.
            You might have taken an incorrect hyperspace turn or the resource was relocated.
        </p>
        <a href="/" class="btn-home">
            <span>&larr;</span> Return to Safety
        </a>
    </div>
</body>
</html>
